<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1410">
<title>Pac-Farm</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<div id="marco">
  <canvas id="pantalla" width="224" height="288"></canvas>

  <!-- Dos formas de manejar, cada uno usa la que le resulte:
       · el joystick del medio, apoyando el dedo y deslizándolo
       · los dos pares de botones, uno para cada pulgar -->
  <div id="mandos">
    <div class="par vertical" aria-label="Arriba y abajo">
      <button class="tecla" data-dir="arriba" aria-label="Arriba">&#9650;</button>
      <button class="tecla" data-dir="abajo" aria-label="Abajo">&#9660;</button>
    </div>

    <div id="rueda" role="application" aria-label="Rueda de dirección">
      <span class="flecha arriba">&#9650;</span>
      <span class="flecha abajo">&#9660;</span>
      <span class="flecha izquierda">&#9664;</span>
      <span class="flecha derecha">&#9654;</span>
      <div id="perilla"></div>
    </div>

    <div class="par horizontal" aria-label="Izquierda y derecha">
      <button class="tecla" data-dir="izquierda" aria-label="Izquierda">&#9664;</button>
      <button class="tecla" data-dir="derecha" aria-label="Derecha">&#9654;</button>
    </div>
  </div>

  <div id="barra">
    <button id="btn-pausa" type="button">Pausa</button>
    <button id="btn-sonido" type="button">Sonido: sí</button>
  </div>

  <p id="ayuda">
    Flechas o WASD para moverte · P para pausar · en el celular, deslizá el dedo
    sobre la rueda o usá los botones de los costados.
  </p>
</div>

<script src="juego.js"></script>
</body>
</html>
