<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1410">
<title>Huerta-Man</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<div id="marco">
  <canvas id="pantalla" width="224" height="288"></canvas>

  <div id="mando" aria-hidden="true">
    <button class="dpad" data-dir="arriba"    aria-label="Arriba">&#9650;</button>
    <div class="fila-dpad">
      <button class="dpad" data-dir="izquierda" aria-label="Izquierda">&#9664;</button>
      <button class="dpad" data-dir="abajo"     aria-label="Abajo">&#9660;</button>
      <button class="dpad" data-dir="derecha"   aria-label="Derecha">&#9654;</button>
    </div>
  </div>

  <div id="barra">
    <button id="btn-pausa" type="button">Pausa</button>
    <button id="btn-sonido" type="button">Sonido: sí</button>
  </div>

  <p id="ayuda">
    Flechas o WASD para moverte · P para pausar · en el celular, deslizá o usá las flechas.
  </p>
</div>

<script src="juego.js"></script>
</body>
</html>
